---
- name: Include OS-specific variables
  ansible.builtin.include_vars: "{{ ansible_os_family }}.yml"

- name: Install packages
  become: true
  become_user: root
  ansible.builtin.package:
    name: "{{ item }}"
    state: present
    update_cache: yes
  loop: "{{ dunst_packages }}"

- name: Create the '$HOME/.config/dunst' directory if not exists
  ansible.builtin.file:
    path: "{{ home }}/.config/dunst"
    mode: u=rwx,g=,o=
    state: directory

- name: Copy dunst files
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ home }}/.config/dunst/{{ item }}"
    mode: u=rw,g=,o=
    force: yes
  loop:
    - dunstrc
  notify: reload dunst
