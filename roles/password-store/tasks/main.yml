---
- name: Include OS-specific variables
  ansible.builtin.include_vars: "{{ ansible_os_family }}.yml"

- name: Install packages
  become: true
  become_user: root
  ansible.builtin.package:
    name: "{{ item }}"
    state: present
    update_cache: yes
  loop: "{{ password_store_packages }}"

- name: Check whether password-store is already cloned
  ansible.builtin.stat:
    path: "{{ home }}/.config/password-store/.git"
  register: password_store_git

- name: Clone password-store into {{ home }}/.config/password-store
  ansible.builtin.git:
    repo: "git@mo-net.lan:password-store.git"
    dest: "{{ home }}/.config/password-store"
    version: "master"
    update: false
    accept_hostkey: yes
  when: not password_store_git.stat.exists
