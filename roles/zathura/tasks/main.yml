---
- name: Include OS-specific variables
  ansible.builtin.include_vars: "{{ ansible_os_family }}.yml"

- name: Install packages
  become: true
  become_user: root
  ansible.builtin.package:
    name: "{{ item }}"
    state: present
    update_cache: yes
  loop: "{{ zathura_packages }}"

- name: Create the '$HOME/.config/zathura' directory if not exists
  ansible.builtin.file:
    path: "{{ home }}/.config/zathura"
    mode: u=rwx,g=,o=
    state: directory

- name: Copy zathura files
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ home }}/.config/zathura/{{ item }}"
    mode: u=rwx,g=,o=
    force: yes
  loop:
    - zathurarc
