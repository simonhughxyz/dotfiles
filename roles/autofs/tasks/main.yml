---
- name: Include OS-specific variables
  ansible.builtin.include_vars: "{{ ansible_os_family }}.yml"

- name: Install packages
  become: true
  become_user: root
  ansible.builtin.package:
    name: "{{ item }}"
    state: present
    update_cache: yes
  loop: "{{ autofs_packages }}"

- name: Create the '/etc/autofs' directory if not exists
  ansible.builtin.file:
    path: "/etc/autofs"
    mode: u=rwx,g=rx,o=rx
    state: directory
  become: true

- name: Copy autofs config files
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/autofs/{{ item }}"
    mode: u=rw,g=r,o=r
    force: yes
  become: true
  loop:
    - auto.master
    - auto.lunar
  notify: restart autofs

- name: Create the '/etc/creds' directory if not exists
  ansible.builtin.file:
    path: "/etc/creds"
    mode: u=rwx,g=,o=
    owner: root
    group: root
    state: directory
  become: true

- name: Render credential files
  ansible.builtin.template:
    src: credentials.j2
    dest: "/etc/creds/{{ credential.name }}"
    mode: u=rw,g=,o=
    owner: root
    group: root
  loop: "{{ etc.credentials }}"
  loop_control:
    loop_var: credential
  no_log: true
  become: true
  notify: restart autofs
